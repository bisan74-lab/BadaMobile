name: bada_mobile
description: "물때·조석 정보와 바람·해양 날씨를 한 앱에서 - BadaMobile (바다윈디)"
publish_to: 'none'

version: 0.4.18+128

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  google_mobile_ads: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/ # 물때 타임라인 사진풍 바다 배경(자체 생성)
    - assets/icon/app_icon.png # 하단 광고 자리(앱 소개 박스)의 아이콘

# 런처 아이콘 생성: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#07162b"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
