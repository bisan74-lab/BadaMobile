name: Wind data refresh

# 바람장 격자 데이터를 Open-Meteo에서 받아 롤링 릴리스(wind-data)에 올린다.
# 앱은 이 정적 파일 하나만 내려받아 지도에 쓴다(사용자 기기가 Open-Meteo를
# 직접 다지점 호출하지 않아 분당 호출 한도에 걸리지 않는다).
#
# 실행 시각은 ECMWF 런 공개에 맞춘다: 새 런(00z/12z)은 대략 08시/20시(UTC)에
# 공개되고 Open-Meteo가 곧 반영하므로 09:15/21:15에 받으면 최신 런이 잡힌다.
# 예전 00:15/06:15/12:15/18:15는 매번 공개 직전에 돌아 항상 한 런(12시간)
# 뒤처진 데이터를 받았다 — 12일 뒤 태풍처럼 런마다 크게 바뀌는 예보가 Windy
# (최신 런)와 어긋나는 원인이었다. 03:15/15:15는 중간 보충(06z/18z 반영).
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3,9,15,21 * * *' # ECMWF 00z/12z 공개(~08/20 UTC) 직후 + 중간 보충

permissions:
  contents: write

# 앞선 실행이 아직 돌고 있으면(배치 대기로 몇 분 걸림) 겹치지 않게 한다.
concurrency:
  group: wind-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 바람장 수집(배치로 한도 준수)
        run: python3 tool/fetch_wind.py

      - name: 롤링 릴리스에 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wind-data
          name: 바람장 데이터 (자동 갱신)
          body: |
            앱 지도용 바람장 격자 데이터입니다(자동 갱신). Open-Meteo ECMWF
            IFS 0.25° 기반. `wind_field.json.gz` 하나만 올라오며, 앱이 이
            파일을 내려받아 씁니다.
          files: wind_field.json.gz
          prerelease: true
