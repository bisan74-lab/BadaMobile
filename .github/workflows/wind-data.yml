name: Wind data refresh

# 바람장 격자 데이터를 Open-Meteo에서 받아 롤링 릴리스(wind-data)에 올린다.
# 앱은 이 정적 파일 하나만 내려받아 지도에 쓴다(사용자 기기가 Open-Meteo를
# 직접 다지점 호출하지 않아 분당 호출 한도에 걸리지 않는다).
#
# **업로드 대상은 이 저장소가 아니라 공개 데이터 저장소다.** 코드 저장소는
# 비공개라 릴리스 자산을 앱이 익명으로 못 받는다(인증 필요 → 404 → 합성
# 데이터로 떨어짐). 그래서 기상 데이터만 공개 저장소에 올린다.
# 필요한 Secret: BADAWINDY_TK — 공개 데이터 저장소에 contents:write 권한이
# 있는 PAT(fine-grained). 예전 이름 PUBLIC_DATA_TOKEN도 폴백으로 받는다.
#
# 실행 시각은 ECMWF 공개 주기에 맞춘다. ECMWF 0.25° 오픈데이터는 하루 4런
# (00z/06z/12z/18z)이 초기시각+약 7.8시간에 공개된다(≈01:50/07:50/13:50/19:50
# UTC), Open-Meteo가 곧 반영. 그래서 두 겹으로 돈다:
# - 1차(공개 ~30분 뒤): 02:20/08:20/14:20/20:20 — 새 런을 최대한 빨리 반영.
#   더 당기면 Open-Meteo에 아직 새 런이 안 올라와 직전 런을 받아올 수 있다.
# - 2차(공개 ~2시간 뒤): 03:45/09:45/15:45/21:45 — GitHub 크론 지연·Open-Meteo
#   반영 지연에 대비한 재수집(같은 런이면 같은 값이라 무해).
# 앱 캐시는 15분이라, 공개→앱 표시까지 보통 45분~1시간 안이다(Windy 수준).
#
# 수집 "간격"을 더 줄여도 소용없다 — ECMWF가 하루 4번만 새 예보를 내므로
# 그 사이엔 같은 값을 다시 받을 뿐이다. 체감 신선도는 시간 해상도가 좌우해서,
# fetch_wind.py가 앞 48시간을 1시간 간격으로 남긴다(FINE_HOURS).
# 예전 00:15/06:15/12:15/18:15는 매번 공개 직전에 돌아 항상 한 런(12시간)
# 뒤처진 데이터를 받았다 — 태풍 예보가 Windy와 어긋나던 원인.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 2,8,14,20 * * *' # 1차: 각 런 공개 직후
    - cron: '45 3,9,15,21 * * *' # 2차: 지연 대비 재수집

permissions:
  contents: write

# 앞선 실행이 아직 돌고 있으면(배치 대기로 몇 분 걸림) 겹치지 않게 한다.
concurrency:
  group: wind-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 수집에 10~15분이 걸리므로, 업로드 토큰이 없으면 **시작하자마자** 멈춘다.
      # (예전엔 다 받아놓고 마지막 업로드에서 "Parameter token is required"로
      #  실패해 15분을 버렸다.)
      - name: 업로드 토큰 확인
        env:
          # 등록된 Secret 이름이 확실하지 않아 흔한 후보를 모두 본다.
          # 값은 출력하지 않고 **어떤 이름이 채워졌는지만** 로그에 남긴다
          # (Secret 이름 자체는 비밀이 아니다).
          A: ${{ secrets.BADAWINDY_TK }}
          B: ${{ secrets.BADAWINDY_TOKEN }}
          C: ${{ secrets.BADAWINDY_DATA_TOKEN }}
          D: ${{ secrets.BADAWINDY_PAT }}
          E: ${{ secrets.PUBLIC_DATA_TOKEN }}
        run: |
          pick=""; name=""
          for pair in "BADAWINDY_TK:$A" "BADAWINDY_TOKEN:$B" \
                      "BADAWINDY_DATA_TOKEN:$C" "BADAWINDY_PAT:$D" \
                      "PUBLIC_DATA_TOKEN:$E"; do
            n="${pair%%:*}"; v="${pair#*:}"
            if [ -n "$v" ]; then pick="$v"; name="$n"; break; fi
          done
          if [ -z "$pick" ]; then
            echo "::error::공개 데이터 저장소 업로드 토큰이 비어 있습니다."
            echo "확인한 이름: BADAWINDY_TK, BADAWINDY_TOKEN, BADAWINDY_DATA_TOKEN,"
            echo "             BADAWINDY_PAT, PUBLIC_DATA_TOKEN — 전부 비어 있음."
            echo "이 저장소(BadaMobile) → Settings → Secrets and variables →"
            echo "Actions → [Secrets] 탭 → Repository secrets 에 등록된"
            echo "**정확한 이름**을 확인해 위 목록 중 하나로 맞춰 주세요."
            exit 1
          fi
          # 값은 어디에도 넘기지 않는다(업로드 단계가 직접 secrets를 읽는다).
          echo "사용할 Secret: $name (길이 ${#pick}자)"

      - name: 바람장 수집(배치로 한도 준수)
        run: python3 tool/fetch_wind.py

      - name: 공개 데이터 저장소의 롤링 릴리스에 업로드
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.PUBLIC_DATA_REPO || 'bisan74-lab/badawindy-data' }}
          token: ${{ secrets.BADAWINDY_TK || secrets.BADAWINDY_TOKEN
            || secrets.BADAWINDY_DATA_TOKEN || secrets.BADAWINDY_PAT
            || secrets.PUBLIC_DATA_TOKEN }}
          tag_name: wind-data
          name: 바람장 데이터 (자동 갱신)
          body: |
            앱 지도용 바람장 격자 데이터입니다(자동 갱신). Open-Meteo ECMWF
            IFS 0.25° 기반. `wind_field.json.gz` 하나만 올라오며, 앱이 이
            파일을 내려받아 씁니다.
          files: wind_field.json.gz
          prerelease: true
