name: Wind data refresh

# 바람장 격자 데이터를 Open-Meteo에서 받아 롤링 릴리스(wind-data)에 올린다.
# 앱은 이 정적 파일 하나만 내려받아 지도에 쓴다(사용자 기기가 Open-Meteo를
# 직접 다지점 호출하지 않아 분당 호출 한도에 걸리지 않는다).
#
# **업로드 대상은 이 저장소가 아니라 공개 데이터 저장소다.** 코드 저장소는
# 비공개라 릴리스 자산을 앱이 익명으로 못 받는다(인증 필요 → 404 → 합성
# 데이터로 떨어짐). 그래서 기상 데이터만 공개 저장소에 올린다.
# 필요한 Secret: BADAWINDY_TK — 공개 데이터 저장소에 contents:write 권한이
# 있는 PAT(fine-grained). 예전 이름 PUBLIC_DATA_TOKEN도 폴백으로 받는다.
#
# 실행 시각은 ECMWF 공개 주기에 맞춘다. ECMWF 0.25° 오픈데이터는 하루 4런
# (00z/06z/12z/18z)이 초기시각+약 7.8시간에 공개된다(≈01:50/07:50/13:50/19:50
# UTC), Open-Meteo가 곧 반영. 그래서 두 겹으로 돈다:
# - 1차(공개 ~55분 뒤): 02:45/08:45/14:45/20:45 — 새 런을 최대한 빨리 반영.
# - 2차(공개 ~2시간 뒤): 03:45/09:45/15:45/21:45 — GitHub 크론 지연·Open-Meteo
#   반영 지연에 대비한 재수집(같은 런이면 같은 값이라 무해).
# 앱 캐시는 15분이라, 공개→앱 표시까지 보통 1~1.5시간 안이다(Windy 수준).
# 예전 00:15/06:15/12:15/18:15는 매번 공개 직전에 돌아 항상 한 런(12시간)
# 뒤처진 데이터를 받았다 — 태풍 예보가 Windy와 어긋나던 원인.
on:
  workflow_dispatch:
  schedule:
    - cron: '45 2,8,14,20 * * *' # 1차: 각 런 공개 직후
    - cron: '45 3,9,15,21 * * *' # 2차: 지연 대비 재수집

permissions:
  contents: write

# 앞선 실행이 아직 돌고 있으면(배치 대기로 몇 분 걸림) 겹치지 않게 한다.
concurrency:
  group: wind-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 바람장 수집(배치로 한도 준수)
        run: python3 tool/fetch_wind.py

      - name: 공개 데이터 저장소의 롤링 릴리스에 업로드
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.PUBLIC_DATA_REPO || 'bisan74-lab/badawindy-data' }}
          token: ${{ secrets.BADAWINDY_TK || secrets.PUBLIC_DATA_TOKEN }}
          tag_name: wind-data
          name: 바람장 데이터 (자동 갱신)
          body: |
            앱 지도용 바람장 격자 데이터입니다(자동 갱신). Open-Meteo ECMWF
            IFS 0.25° 기반. `wind_field.json.gz` 하나만 올라오며, 앱이 이
            파일을 내려받아 씁니다.
          files: wind_field.json.gz
          prerelease: true
