name: Fishing data refresh

# 바다낚시지수 전국 하루치를 모아 공개 데이터 저장소의 롤링 릴리스에 올린다.
# 앱은 이 파일 하나(약 20KB)만 받으면 되고, data.go.kr을 직접 호출하지 않는다.
#
# **왜 서버가 대신 받나** — 이 API는 numOfRows 상한이 300이라 전국 1,750건을
# 받으려면 6쪽을 나눠 받아야 하고 6초쯤 걸린다(실측). 낚시지수는 하루 한 번
# 갱신되는 예보라 기기마다 그걸 반복할 이유가 없다. 덤으로 앱에서 data.go.kr
# 인증키를 쓰는 경로가 하나 줄어든다.
#
# 필요한 Secret:
#   DATA_GO_KR_API_KEY  공공데이터포털 인증키
#   BADAWINDY_TK        공개 데이터 저장소에 contents:write 권한이 있는 PAT
#
# **2026-08 현재 이 워크플로는 실패한다 — 우리 코드 문제가 아니다.**
# data.go.kr이 8/4 무렵부터 GitHub Actions 대역(미국)에서 오는 요청에 응답을
# 주지 않는다. 같은 요청이 한국 IP에서는 정상 키로 0.26초에 200을 받는다
# (실측). 재시도·User-Agent·타임아웃을 손봐도 소용이 없었다.
#
# 그래서 크론을 하루 네 번에서 **한 번**으로 줄여 뒀다. 아예 끄지 않는 이유는
# 차단이 풀리면 하루 안에 알아채기 위해서다. **해결되면(수집이 한국 IP에서
# 돌게 되면) 아래 주석 처리한 세 줄을 되살린다** — 한 번 실패해도 그날 안에
# 만회할 기회가 생기고, 이미 최근 파일이 있으면 첫 스텝에서 건너뛰므로
# 횟수를 늘려도 data.go.kr을 더 두드리지는 않는다.
#
# 그동안 앱은 서버 파일이 낡은 것을 보고 data.go.kr을 직접 부른다(사용자
# 기기는 한국 IP라 잘 닿는다). 정확도는 그대로이고 지역 변경이 몇 초 느려진다.
on:
  workflow_dispatch:
  schedule:
    - cron: '10 20 * * *' # 05:10 KST
    # - cron: '10 0 * * *' # 09:10 KST
    # - cron: '10 4 * * *' # 13:10 KST
    # - cron: '10 8 * * *' # 17:10 KST

permissions:
  contents: write

concurrency:
  group: fishing-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 재시도 백오프까지 다 돌아도 5분 안쪽이다. 그보다 오래 걸린다면
    # 어딘가 매달려 있는 것이니 러너를 붙잡고 있지 말고 끊는다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 토큰이 없거나 잘려 있으면 수집 전에 멈춘다(wind-data.yml과 같은 이유).
      - name: 업로드 토큰 확인
        env:
          TK: ${{ secrets.BADAWINDY_TK }}
        run: |
          if [ -z "$TK" ]; then
            echo "::error::Secret BADAWINDY_TK 가 비어 있습니다."
            exit 1
          fi
          n=${#TK}
          case "$TK" in
            github_pat_*) kind="fine-grained"; want=93 ;;
            ghp_*)        kind="classic";      want=40 ;;
            *)            kind="";             want=0  ;;
          esac
          if [ -z "$kind" ] || [ "$n" -ne "$want" ]; then
            echo "::error::BADAWINDY_TK 값이 GitHub 토큰 형태가 아닙니다(${n}자)."
            exit 1
          fi
          echo "BADAWINDY_TK 확인: $kind 토큰, ${n}자 — 형태 정상"

      # 크론을 여러 번 돌려도 최근에 성공한 뒤에는 data.go.kr을 또 두드리지
      # 않는다. 판단 기준은 파일의 `generated`(만든 시각)다 — "오늘 날짜가
      # 들어 있는가"로 보면 안 된다. 이 API는 며칠 앞까지 주므로 수집이 멈춘
      # 뒤에도 이틀쯤은 오늘이 들어 있는 낡은 파일이 남아, 워크플로가 영영
      # 수집을 건너뛴다(2026-08-06에 실제로 한 번 이렇게 건너뛰었다).
      # 확인 자체가 실패하면 fresh=false라 그냥 수집한다.
      - name: 최근에 받아 둔 파일이 있는지 확인
        id: published
        run: python3 tool/fetch_fishing.py --check-published >> "$GITHUB_OUTPUT"

      - name: 낚시지수 수집
        if: steps.published.outputs.fresh != 'true'
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python3 tool/fetch_fishing.py

      - name: 공개 데이터 저장소의 롤링 릴리스에 업로드
        if: steps.published.outputs.fresh != 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.PUBLIC_DATA_REPO || 'bisan74-lab/badawindy-data' }}
          token: ${{ secrets.BADAWINDY_TK }}
          tag_name: fishing-data
          name: 낚시지수 데이터 (자동 갱신)
          body: |
            앱 낚시정보용 바다낚시지수입니다(자동 갱신).
            해양수산부 공공데이터 기반. `fishing_index.json.gz` 하나만
            올라오며, 앱이 이 파일을 내려받아 씁니다.
          files: fishing_index.json.gz
          prerelease: true
